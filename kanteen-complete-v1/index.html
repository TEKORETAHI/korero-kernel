<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101e"><title>Kanteen — Venue & Events</title><style>html,body{margin:0;height:100%;background:#06101e;color:#f5f9ff;font-family:system-ui,-apple-system,sans-serif}.load{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.mark{width:52px;height:52px;margin:0 auto 14px;border-radius:17px;background:linear-gradient(135deg,#9ccbff,#d9b86c);animation:p 1.4s ease-in-out infinite}@keyframes p{50%{transform:scale(.92);opacity:.65}}small{color:#90a4bd;display:block;max-width:330px;line-height:1.45}.err{color:#ffb7b7}</style></head><body><div class="load"><div><div class="mark"></div><b>KANTEEN</b><br><small id="status">Loading verified app bundle…</small></div></div><script type="module">
const status=document.querySelector('#status');
const parts=['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt','p6.txt','p7.txt','p8a.txt','p8b.txt','p8c.txt','p8d.txt','p8e.txt','p9.txt'];
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function decodeBase64(input){
  const s=input.replace(/[^A-Za-z0-9+/=]/g,'');
  const out=[];let buffer=0,bits=0;
  for(const ch of s){
    if(ch==='=')break;
    const v=alphabet.indexOf(ch);if(v<0)continue;
    buffer=(buffer<<6)|v;bits+=6;
    if(bits>=8){bits-=8;out.push((buffer>>bits)&255);buffer&=(1<<bits)-1;}
  }
  return new Uint8Array(out);
}
async function gunzip(bytes){
  if('DecompressionStream' in globalThis){
    const ds=new DecompressionStream('gzip');
    return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  }
  const mod=await import('https://cdn.jsdelivr.net/npm/pako@2.1.0/+esm');
  return new TextDecoder().decode(mod.ungzip(bytes));
}
try{
  const chunks=[];
  for(let i=0;i<parts.length;i++){
    status.textContent=`Loading Kanteen ${i+1}/${parts.length}…`;
    const r=await fetch('./'+parts[i]+'?v=2',{cache:'no-store'});
    if(!r.ok)throw new Error(`Missing bundle segment ${parts[i]} (${r.status})`);
    chunks.push((await r.text()).trim());
  }
  status.textContent='Starting Kanteen…';
  const bytes=decodeBase64(chunks.join(''));
  if(bytes.length<1000)throw new Error('Bundle decode was unexpectedly small');
  const html=await gunzip(bytes);
  if(!html.includes('Kanteen Complete v1.0'))throw new Error('Decoded bundle did not verify as Kanteen Complete');
  document.open();document.write(html);document.close();
}catch(e){
  console.error(e);
  document.body.innerHTML='<div class="load"><div><div class="mark"></div><b>Kanteen could not start.</b><small class="err">'+String(e?.name?e.name+': '+e.message:e)+'</small><small style="margin-top:12px">The app payload is safe; this message identifies the hosting/bootstrap problem.</small></div></div>';
}
</script></body></html>
