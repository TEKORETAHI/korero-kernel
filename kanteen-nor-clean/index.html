<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111e"><title>Kanteen NOR Clean</title><style>
:root{--b:#07111e;--p:#10243a;--p2:#17314f;--l:rgba(170,210,245,.16);--t:#f5f9ff;--m:#93a7bb;--c:#9dd8ff;--g:#d9b86c;--ok:#7addaa;--w:#f2c96d;--r:#ef8c8c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.btn{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:13px;padding:10px 12px;font-weight:800}.primary{background:#eff9ff;color:#07111e}.gold{background:var(--g);color:#111}.card{border:1px solid var(--l);background:linear-gradient(180deg,#10243a,#091a2c);border-radius:20px;padding:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:10px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.input{width:100%;border:1px solid var(--l);background:#081827;color:var(--t);border-radius:12px;padding:11px}.small{font-size:11px}.tiny{font-size:9px}.muted{color:var(--m)}.eye{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--m);font-weight:800}.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--l);border-radius:999px;padding:6px 8px;background:#0a1b2d;color:var(--m);font-size:9px}.dot{width:7px;height:7px;border-radius:50%;background:var(--m)}.ok{background:var(--ok)}.warn{background:var(--w)}.bad{background:var(--r)}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--l);background:rgba(7,17,30,.92);backdrop-filter:blur(12px)}.brand{display:flex;gap:8px;align-items:center}.mark{width:35px;height:35px;border-radius:12px;background:linear-gradient(135deg,var(--c),var(--g))}.brand b{letter-spacing:.08em}.brand span{display:block;font-size:9px;color:var(--m)}.hero{min-height:660px;display:grid;align-items:center;background:radial-gradient(circle at 75% 20%,rgba(157,216,255,.12),transparent 24%),linear-gradient(180deg,#07111e,#09182a)}.heroIn,.section,.wrap{width:min(1120px,calc(100% - 26px));margin:auto}.heroIn{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.hero h1{font-size:clamp(52px,9vw,90px);line-height:.9;letter-spacing:-.06em;margin:10px 0}.hero p{max-width:620px;color:#bfd0e1;line-height:1.5}.section{padding:54px 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.visual{height:180px;border-radius:16px;background:radial-gradient(circle at 70% 30%,rgba(157,216,255,.28),transparent 22%),linear-gradient(145deg,#173a58,#102943 55%,#0b1828)}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.admin{min-height:100vh}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 12px;border-bottom:1px solid var(--l)}.tabs button.on{outline:1px solid var(--c)}.work{width:min(1180px,calc(100% - 20px));margin:auto;padding:14px 0 90px}.list{display:grid;gap:7px}.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--l);border-radius:13px;background:#0a1b2c}.item h3{margin:0;font-size:13px}.item p{margin:3px 0 0;font-size:9px;color:var(--m)}.builder{display:grid;grid-template-columns:220px 1fr;gap:10px}.lib{display:block;width:100%;margin:6px 0;border:1px solid var(--l);background:#0a1c2e;color:white;border-radius:12px;padding:9px;text-align:left}.piece{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px;border:1px solid var(--l);border-radius:13px;background:#0b1e32;margin-top:7px}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.money div{padding:8px;border:1px solid var(--l);border-radius:11px;background:#081725}.money span{display:block;font-size:8px;color:var(--m)}.msgs{max-height:320px;overflow:auto;display:grid;gap:7px}.bubble{max-width:82%;padding:9px;border:1px solid var(--l);border-radius:13px;background:#0d2136;font-size:11px}.bubble.me{justify-self:end;background:#173a5d}.modal{position:fixed;z-index:80;inset:0;background:rgba(0,0,0,.58);display:grid;align-items:end}.sheet{max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;border-top:1px solid var(--l);background:#071421;padding:15px 15px max(18px,env(safe-area-inset-bottom))}.report{width:100%;min-height:240px;background:#04101a;color:#b9cada;border:1px solid var(--l);border-radius:12px;padding:9px;font-family:ui-monospace,monospace;font-size:9px}.float{position:fixed;right:12px;bottom:12px;z-index:50}.toast{position:fixed;z-index:100;left:50%;top:16px;transform:translateX(-50%);background:#12304d;border:1px solid rgba(157,216,255,.35);padding:9px 13px;border-radius:999px;font-weight:800}.hidden{display:none!important}@media(max-width:800px){.heroIn{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.builder{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Number(n)||0),uid=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),STORE='kanteen.nor.clean.v1';
class Nor{constructor(n=256){this.n=n;this.q=n*2;this.nq=n*3;this.w=new Uint8Array(n*4+16);this.g=[];this.transitions=0;for(let i=0;i<n;i++){const s=i*2,r=s+1,q=this.q+i,nq=this.nq+i;this.g.push({a:r,b:nq,o:q},{a:s,b:q,o:nq})}}settle(){for(let k=0;k<8;k++){let c=false;for(const g of this.g){const v=(this.w[g.a]||this.w[g.b])?0:1;if(this.w[g.o]!==v){this.w[g.o]=v;c=true;this.transitions++}}if(!c)break}}set(i,v){const s=i*2,r=s+1;this.w[s]=v?1:0;this.w[r]=v?0:1;this.settle();this.w[s]=this.w[r]=0;this.settle()}get(i){return this.w[this.q+i]?1:0}setByte(i,v){for(let b=0;b<8;b++)this.set(i*8+b,(v>>b)&1)}getByte(i){let v=0;for(let b=0;b<8;b++)v|=this.get(i*8+b)<<b;return v}}const fabric=new Nor(256);
function fresh(){return{spaces:[{id:'deck',name:'River Deck',standing:150,seated:100,privacy:'Exclusive',price:1800,desc:'Indoor / outdoor deck for dinner, dancing and private events.'},{id:'garden',name:'Garden Room',standing:80,seated:70,privacy:'Private',price:1150,desc:'Garden-facing room for celebrations and meetings.'},{id:'studio',name:'Studio Hall',standing:70,seated:50,privacy:'Private',price:850,desc:'Flexible blank-canvas room for workshops and community nights.'}],vendors:[{id:'vc',business:'Mango & Mint Catering',category:'Catering',verified:true},{id:'vd',business:'Nightjar Sounds',category:'DJ',verified:true},{id:'vs',business:'Southbank Styling Co.',category:'Styling',verified:true}],apps:[],lib:[{id:'ld',name:'River Deck Exclusive',cat:'Space',sell:1800,cost:800,unit:'event',vendor:null},{id:'lf',name:'Seasonal grazing feast',cat:'Catering',sell:58,cost:41,unit:'guest',vendor:'vc'},{id:'ldj',name:'DJ + dance-floor sound',cat:'Entertainment',sell:1050,cost:650,unit:'event',vendor:'vd'},{id:'ls',name:'Signature room styling',cat:'Styling',sell:1650,cost:900,unit:'event',vendor:'vs'}],events:[{id:'e1',name:'Jordan & Mae — Celebration',date:'2026-08-05',guests:82,status:'awaiting_approval',published:false}],items:[{id:'i1',event:'e1',lib:'ld',name:'River Deck Exclusive',qty:1,sell:1800,cost:800,vendor:null},{id:'i2',event:'e1',lib:'lf',name:'Seasonal grazing feast',qty:82,sell:58,cost:41,vendor:'vc'},{id:'i3',event:'e1',lib:'ldj',name:'DJ + dance-floor sound',qty:1,sell:1050,cost:650,vendor:'vd'}],approvals:[{id:'a1',event:'e1',item:'i2',vendor:'vc',status:'yes'},{id:'a2',event:'e1',item:'i3',vendor:'vd',status:'pending'}],messages:[{id:'m1',thread:'team',sender:'Ari',body:'Deck layout is clear for next weekend.'},{id:'m2',thread:'team',sender:'Sam',body:'I’ll chase the DJ approval.'}],enquiries:[],traces:[],selected:'e1'}}
let db=(()=>{try{return JSON.parse(localStorage.getItem(STORE))||fresh()}catch{return fresh()}})(),state={surface:'public',view:'events',selected:db.selected||'e1',errors:[]};const app=$('#app'),toast=$('#toast');addEventListener('error',e=>state.errors.push(String(e.message||e.error)));function say(t){toast.textContent=t;toast.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.add('hidden'),1400)}function trace(a,o){db.traces.push({at:new Date().toISOString(),a,o});if(db.traces.length>100)db.traces.shift()}function save(){db.selected=state.selected;localStorage.setItem(STORE,JSON.stringify(db));sync();trace('SAVE','ok')}function sync(){const vals=[state.surface==='public'?1:state.surface==='admin'?2:3,['events','vendors','chat','ledger','system'].indexOf(state.view)+1,db.events.length,db.vendors.length,db.apps.length,db.approvals.filter(x=>x.status==='pending').length,db.messages.length,db.enquiries.length];vals.forEach((v,i)=>{if(fabric.getByte(i)!==v)fabric.setByte(i,v)})}function totals(id){const xs=db.items.filter(x=>x.event===id),quoted=xs.reduce((s,x)=>s+x.sell*x.qty,0),cost=xs.reduce((s,x)=>s+x.cost*x.qty,0);return{quoted,cost,margin:quoted-cost}}function gate(id){const r=[];if(!db.items.some(x=>x.event===id&&x.lib==='ld'))r.push('No space');if(db.approvals.some(x=>x.event===id&&x.status==='pending'))r.push('Vendor approvals pending');if(db.approvals.some(x=>x.event===id&&x.status==='no'))r.push('Vendor declined');return{ok:!r.length,reasons:r}}function vendor(id){return db.vendors.find(x=>x.id===id)?.business||'Unassigned'}function status(s){const c=['yes','approved','confirmed'].includes(s)?'ok':['pending','awaiting_approval'].includes(s)?'warn':['no','declined'].includes(s)?'bad':'';return`<span class="chip"><span class="dot ${c}"></span>${esc(s.replaceAll('_',' '))}</span>`}
function render(){sync();state.surface==='public'?publicPage():state.surface==='admin'?adminPage():loginPage()}
function publicPage(){app.innerHTML=`<div class="top"><div class="brand"><div class="mark"></div><div><b>KANTEEN</b><span>Venue & Events · Waterford</span></div></div><div class="row"><button class="btn" id="join">Vendor signup</button><button class="btn primary" id="admin">Admin</button></div></div><section class="hero"><div class="heroIn"><div><span class="chip"><span class="dot ok"></span>Waterford · Queensland</span><h1>Make the event feel easy.</h1><p>Pick a space, mix food, music and styling, then send one clear plan. Kanteen handles vendors, approvals, chat and operational ledgers behind the scenes.</p><button class="btn gold" id="toBuild">Build your event</button></div><div class="card stack"><div class="eye">Quick plan</div><input class="input" id="qGuests" type="number" value="60"><select class="input" id="qSpace">${db.spaces.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn primary" id="toBuild2">Mix options</button></div></div></section><section class="section"><div class="eye">Spaces</div><h2>Choose the setting.</h2><div class="cards">${db.spaces.map(s=>`<div class="card"><div class="visual"></div><h3>${esc(s.name)}</h3><div class="row"><span class="chip">${s.standing} standing</span><span class="chip">${s.seated} seated</span></div><p class="small muted">${esc(s.desc)}</p><b>from ${money(s.price)}</b></div>`).join('')}</div></section><section class="section" id="build"><div class="eye">Event mixer</div><h2>Mix the night.</h2><div class="g2"><div class="card stack"><input class="input" id="mixGuests" type="number" value="60"><select class="input" id="mixSpace">${db.spaces.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>${db.lib.filter(x=>x.lib!=='ld').map(x=>`<button class="lib" data-mix="${x.id}"><b>${esc(x.name)}</b><div class="tiny muted">${money(x.sell)}${x.unit==='guest'?'/guest':''}</div></button>`).join('')}</div><div class="card"><h3 id="mixTitle">Celebration · 60 guests</h3><div id="mixPieces"></div><h2 id="mixTotal"></h2><input class="input" id="name" placeholder="Your name"><input class="input" id="email" type="email" placeholder="Email" style="margin-top:7px"><button class="btn gold" id="send" style="margin-top:7px">Send this plan</button></div></div></section>`;let mix={guests:60,space:'deck',items:[]};const draw=()=>{const sp=db.spaces.find(x=>x.id===mix.space);let total=sp.price;const rows=[`<div class="piece"><b>${esc(sp.name)}</b><b>${money(sp.price)}</b></div>`];for(const id of mix.items){const l=db.lib.find(x=>x.id===id),q=l.unit==='guest'?mix.guests:1;total+=l.sell*q;rows.push(`<div class="piece"><b>${esc(l.name)}</b><b>${money(l.sell*q)}</b></div>`)}$('#mixTitle').textContent=`Celebration · ${mix.guests} guests`;$('#mixPieces').innerHTML=rows.join('');$('#mixTotal').textContent=money(total);mix.total=total};$('#admin').onclick=()=>{state.surface='login';render()};$('#join').onclick=()=>vendorSignup();$('#toBuild').onclick=$('#toBuild2').onclick=()=>$('#build').scrollIntoView({behavior:'smooth'});$('#mixGuests').oninput=e=>{mix.guests=Number(e.target.value)||1;draw()};$('#mixSpace').onchange=e=>{mix.space=e.target.value;draw()};$$('[data-mix]').forEach(b=>b.onclick=()=>{const id=b.dataset.mix;mix.items=mix.items.includes(id)?mix.items.filter(x=>x!==id):mix.items.concat(id);draw()});$('#send').onclick=()=>{const name=$('#name').value.trim(),email=$('#email').value.trim();if(!name||!email.includes('@'))return say('Add your name and email');db.enquiries.push({id:uid('q'),name,email,guests:mix.guests,space:mix.space,items:mix.items,estimate:mix.total,status:'new'});save();say('Plan sent to Kanteen')};draw()}
function loginPage(){app.innerHTML=`<div class="login"><div class="card stack" style="width:min(480px,100%)"><div class="brand"><div class="mark"></div><div><b>KANTEEN NOR CLEAN</b><span>single-file runtime</span></div></div><h1>Admin</h1><input class="input" id="pass" type="password" inputmode="numeric" placeholder="Password"><button class="btn gold" id="enter">Enter</button><button class="btn" id="back">Back</button></div></div>`;$('#back').onclick=()=>{state.surface='public';render()};$('#enter').onclick=()=>{if($('#pass').value!=='1984410')return say('Wrong password');state.surface='admin';trace('LOGIN','sandbox admin');render()}}
const tabs=[['events','Events'],['vendors','Vendors'],['chat','Chat'],['ledger','Ledger'],['system','System']];function adminPage(){app.innerHTML=`<div class="admin"><div class="top"><div class="brand"><div class="mark"></div><div><b>KANTEEN NOR CLEAN</b><span>single HTML · local runtime</span></div></div><button class="btn" id="exit">Exit</button></div><div class="tabs">${tabs.map(t=>`<button class="btn ${state.view===t[0]?'on':''}" data-view="${t[0]}">${t[1]}</button>`).join('')}</div><main class="work" id="work"></main><button class="btn float" id="core">◎ Core Lens</button></div>`;$('#exit').onclick=()=>{state.surface='public';render()};$$('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;adminPage()});$('#core').onclick=openCore;renderView()}
function renderView(){const w=$('#work');state.view==='events'?events(w):state.view==='vendors'?vendors(w):state.view==='chat'?chat(w):state.view==='ledger'?ledger(w):system(w)}
function events(w){w.innerHTML=`<h1>Events</h1><div class="list">${db.events.map(e=>{const t=totals(e.id),g=gate(e.id);return`<div class="item"><div><div class="row"><h3>${esc(e.name)}</h3>${status(e.status)}</div><p>${e.date} · ${e.guests} guests · ${money(t.quoted)} · ${g.ok?'ready':'needs '+g.reasons.length}</p></div><button class="btn" data-open="${e.id}">Build</button></div>`}).join('')}</div>`;$$('[data-open]').forEach(b=>b.onclick=()=>builder(b.dataset.open))}
function builder(id){state.selected=id;const e=db.events.find(x=>x.id===id),xs=db.items.filter(x=>x.event===id),t=totals(id),g=gate(id),w=$('#work');w.innerHTML=`<div class="row between"><div><div class="eye">Event builder</div><h1>${esc(e.name)}</h1></div><button class="btn ${g.ok?'primary':''}" id="confirm">${g.ok?'Confirm':'Check gates'}</button></div><div class="builder"><aside class="card"><div class="eye">Library</div>${db.lib.map(l=>`<button class="lib" data-add="${l.id}"><b>${esc(l.name)}</b><div class="tiny muted">${money(l.sell)}${l.unit==='guest'?'/guest':''}</div></button>`).join('')}</aside><section class="card"><div class="money"><div><span>Quote</span><b>${money(t.quoted)}</b></div><div><span>Cost</span><b>${money(t.cost)}</b></div><div><span>Margin</span><b>${money(t.margin)}</b></div></div><div style="margin-top:10px">${xs.map(x=>{const a=db.approvals.find(y=>y.item===x.id);return`<div class="piece"><div><b>${esc(x.name)} × ${x.qty}</b><div class="tiny muted">${esc(vendor(x.vendor))}</div></div>${a?status(a.status):''}</div>`}).join('')}</div><div class="card" style="margin-top:10px"><div class="eye">Gates</div><div class="small">${g.ok?'Ready to confirm':g.reasons.map(x=>'• '+esc(x)).join('<br>')}</div></div></section></div>`;$$('[data-add]').forEach(b=>b.onclick=()=>{const l=db.lib.find(x=>x.id===b.dataset.add),qid=l.unit==='guest'?e.guests:1,i=uid('i');db.items.push({id:i,event:id,lib:l.id,name:l.name,qty:qid,sell:l.sell,cost:l.cost,vendor:l.vendor});if(l.vendor)db.approvals.push({id:uid('a'),event:id,item:i,vendor:l.vendor,status:'pending'});e.status='awaiting_approval';save();builder(id)});$('#confirm').onclick=()=>{const gg=gate(id);if(!gg.ok)return say(gg.reasons[0]);e.status='confirmed';save();say('Event confirmed');builder(id)}}
function vendorSignup(){modal('Vendor signup',`<input class="input" id="vb" placeholder="Business name"><input class="input" id="ve" type="email" placeholder="Email" style="margin-top:7px"><button class="btn primary" id="vs" style="margin-top:7px">Submit</button>`);$('#vs').onclick=()=>{if(!$('#vb').value||!$('#ve').value.includes('@'))return say('Add business and email');db.apps.push({id:uid('va'),business:$('#vb').value,email:$('#ve').value,status:'pending'});save();$('#modal').remove();say('Application sent')}}function vendors(w){w.innerHTML=`<h1>Vendors</h1>${db.apps.length?`<div class="card"><div class="eye">Needs validation</div>${db.apps.map(a=>`<div class="item"><div><h3>${esc(a.business)}</h3><p>${esc(a.email)}</p></div><button class="btn primary" data-approve="${a.id}">Approve</button></div>`).join('')}</div>`:''}<div class="list" style="margin-top:10px">${db.vendors.map(v=>`<div class="item"><div><h3>${esc(v.business)}</h3><p>${esc(v.category)}</p></div><span class="chip"><span class="dot ok"></span>verified</span></div>`).join('')}</div>`;$$('[data-approve]').forEach(b=>b.onclick=()=>{const a=db.apps.find(x=>x.id===b.dataset.approve);db.vendors.push({id:uid('v'),business:a.business,category:'New vendor',verified:true});db.apps=db.apps.filter(x=>x.id!==a.id);save();adminPage()})}
function chat(w){w.innerHTML=`<h1>Team chat</h1><div class="card"><div class="msgs">${db.messages.filter(x=>x.thread==='team').map(m=>`<div class="bubble"><span class="tiny muted">${esc(m.sender)}</span><br>${esc(m.body)}</div>`).join('')}</div><div class="row" style="margin-top:10px"><input class="input" id="msg" placeholder="Message team"><button class="btn primary" id="sendMsg">Send</button></div></div>`;$('#sendMsg').onclick=()=>{const body=$('#msg').value.trim();if(!body)return;db.messages.push({id:uid('m'),thread:'team',sender:'Admin',body});save();adminPage()}}
function ledger(w){let q=0,c=0;db.events.forEach(e=>{const t=totals(e.id);q+=t.quoted;c+=t.cost});w.innerHTML=`<h1>Ledger</h1><div class="g2"><div class="card"><div class="eye">Quoted</div><h2>${money(q)}</h2></div><div class="card"><div class="eye">Est. margin</div><h2>${money(q-c)}</h2></div></div><p class="small muted">Operational ledger only. No money moves here.</p>`}
function system(w){w.innerHTML=`<h1>System</h1><div class="g2"><div class="card"><div class="eye">NOR state</div><h2>256 bits · ${fabric.g.length} gates</h2><div class="small muted">${fabric.transitions.toLocaleString()} transitions</div></div><div class="card"><div class="eye">Errors</div><h2>${state.errors.length}</h2></div></div>`}
function modal(title,body){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="sheet"><div class="row between"><h2>${esc(title)}</h2><button class="btn" id="close">×</button></div>${body}</div></div>`);$('#close').onclick=()=>$('#modal').remove();$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').remove()}}
function report(){const e=db.events.find(x=>x.id===state.selected),t=e?totals(e.id):null,g=e?gate(e.id):null;return['KANTEEN NOR CLEAN REPORT','time: '+new Date().toISOString(),'device: '+navigator.userAgent,'surface: '+state.surface,'view: '+state.view,`entities: events=${db.events.length} vendors=${db.vendors.length} applications=${db.apps.length} enquiries=${db.enquiries.length} approvals=${db.approvals.length} messages=${db.messages.length}`,`selected: ${e?e.name+' quote='+t.quoted+' cost='+t.cost+' margin='+t.margin+' gate='+(g.ok?'ready':g.reasons.join('|')):'none'}`,`nor: bits=${fabric.n} gates=${fabric.g.length} transitions=${fabric.transitions}`,`errors: ${state.errors.length?state.errors.join(' | '):'none'}`].join('\n')}function openCore(){const r=report();modal('Core Lens',`<textarea class="report" id="r" readonly>${esc(r)}</textarea><button class="btn primary" id="copy">Copy Report</button>`);$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(r);say('Report copied')}catch{$('#r').select()}}}
render();})();
</script></body></html>
