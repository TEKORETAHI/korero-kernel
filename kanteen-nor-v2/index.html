==id&&['blocked','booked'].includes(x.status)))r.push('Venue conflict');return{ok:!r.length,reasons:r}}function vname(id){return db.vendors.find(x=>x.id===id)?.business||'Unassigned'}function stat(s){const c=['confirmed','yes','accepted','approved'].includes(s)?'ok':['pending','awaiting_approval','hold'].includes(s)?'w':['no','declined','blocked'].includes(s)?'r':'';return`<span class="chip"><span class="dot ${c}"></span>${esc(s.replaceAll('_',' '))}</span>`}function modal(t,b){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="sheet"><div class="sheetIn"><div class="row between"><h2>${esc(t)}</h2><button class="btn" id="xmodal">×</button></div>${b}</div></div></div>`);$('#xmodal').onclick=()=>$('#modal').remove();$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').remove()}}function render(){sync();if(state.surface==='public')pub();else if(state.surface==='login')login();else if(state.surface==='admin')admin();else if(state.surface==='vendor')vendor();else customer()}function pub(){app.innerHTML=`<div class="top"><div class="brand"><div class="mark"></div><div><b>KANTEEN NOR</b><span>Venue & Events · Waterford</span></div></div><div class="row"><button class="btn" id="join">Vendor</button><button class="btn" id="my">My event</button><button class="btn primary" id="adm">Admin</button></div></div><section class="hero"><canvas id="hc"></canvas><div class="shade"></div><div class="heroIn"><div><span class="chip"><span class="dot ok"></span>Waterford · Queensland</span><h1>Make the event feel easy.</h1><p>Choose a space, mix food, music and styling, then send one clear plan. Kanteen handles availability, vendor validation, chat and operational ledgers behind the scenes.</p><button class="btn primary" id="build">Build your event</button></div><div class="card stack"><div class="eye">Quick plan</div><select class="input" id="ptype"><option>Celebration</option><option>Wedding</option><option>Birthday</option><option>Corporate</ nd(x=>x.id===b.dataset.j),a=db.approvals.find(x=>x.item===j.item);j.status=b.dataset.ja;if(a)a.status=b.dataset.ja==='accepted'?'yes':'no';save();vendor()})}function customer(){const q=db.enquiries.find(x=>x.id===state.customer),ms=db.messages.filter(x=>x.thread===q?.portal);app.innerHTML=`<div class="top"><div class="brand"><div class="mark"></div><div><b>KANTEEN</b><span>My event</span></div></div><button class="btn" id="cx">Exit</button></div><div class="section"><h1>${esc(q?.type||'Your plan')}</h1><div class="g2"><div class="card"><div class="eye">Plan</div><h2>${esc(q?.date||'')}</h2><div class="row"><span class="chip">${q?.guests||0} guests</span><span class="chip">${money(q?.estimate||0)}</span>${stat(q?.status||'new')}</div><p class="small muted">${esc(q?.notes||'')}</p></div><div class="card"><div class="eye">Conversation</div><div class="msgs">${ms.map(m=>`<div class="bubble ${m.sender!=='Kanteen'?'me':''}">${esc(m.sender)}<br>${esc(m.body)}</div>`).join('')}</div><form id="cs" class="row" style="margin-top:8px"><input class="input" style="flex:1" name="b"><button class="btn primary">Send</button></form></div></div></div>`;$('#cx').onclick=()=>{state.surface='public';render()};$('#cs').onsubmit=e=>{e.preventDefault();db.messages.push({id:uid('m'),thread:q.portal,sender:q.name,body:new FormData(e.currentTarget).get('b'),at:new Date().toISOString()});save();customer()}}function hero(){const c=$('#hc');if(!c)return,0;const x=c.getContext('2d'),pts=Array.from({length:55},()=>({x:Math.random(),y:Math.random(),p:Math.random()*6.2,z:Math.random()}));function d(t){if(!document.body.contains(c))return;const r=c.getBoundingClientRect(),q=Math.min(devicePixelRatio||1,1.4);c.width=r.width*q;c.height=r.height*q;x.clearRect(0,0,c.width,c.height);for(let i=0;i<pts.length;i++){const p=pts[i],a=p.x*c.width+Math.sin(t*.0002+p.p)*25*q,b=p.y*c.height+Math.cos(t*.00015+p.p)*20*q;x.fillStyle=`rgba(190,225,255,${.08+p.z*.2})`;x.beginPath();x.arc(a,b,(1+p.z*2)*q,0,Math.PI*2);x.f
