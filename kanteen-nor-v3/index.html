function normalise(old){const d=defaults();if(!old||typeof old!=='object')return d;const out={...d,...old,version:3};out.venue={...d.venue,...(old.venue||{})};out.spaces=(old.spaces&&old.spaces.length?old.spaces:d.spaces).map((s,i)=>({...d.spaces[Math.min(i,d.spaces.length-1)],...s}));out.vendors=(old.vendors&&old.vendors.length?old.vendors:d.vendors).map(v=>({...d.vendors.find(x=>x.id===v.id),...v}));out.applications=old.applications||old.apps||[];out.library=old.library||old.lib||d.library;out.events=old.events||d.events;out.items=old.items||d.items;out.approvals=old.approvals||d.approvals;out.assignments=old.assignments||d.assignments;out.blocks=old.blocks||d.blocks;out.enquiries=old.enquiries||[];out.messages=old.messages||d.messages;out.team=old.team||d.team;out.traces=old.traces||[];out.selected=old.selected||d.selected;out.customers=old.customers||d.customers;out.notifications=old.notifications||[];return out}

function wirePublic(){let mix={type:'Celebration',space:'deck',guests:60,date:addDays(iso(),14),items:[],notes:''};const redraw=()=>{const sp=db.spaces.find(x=>x.id===mix.space)||db.spaces[0];let total=sp.price||0;const rows=[`<div class="piece"><div><b>${esc(sp.name)}</b><span>Space</span></div><b>${money(sp.price||0)}</b></div>`];for(const id of mix.items){const l=db.library.find(x=>x.id===id);if(!l)continue;const q=l.unit==='guest'?mix.guests:1;total+=l.sell*q;rows.push(`<div class="piece"><div><b>${esc(l.name)}</b><span>${esc(l.cat)}</span></div><b>${money(l.sell*q)}</b></div>`)}$('#planTitle').textContent=`${mix.type} · ${mix.guests} guests`;$('#planPieces').innerHTML=rows.join('');$('#planTotal').textContent=money(total);mix.total=total};$('#adminOpen').onclick=()=>{state.surface='login';render()};$('#vendorJoin').onclick=vendorSignup;$('#customerOpen').onclick=customerLogin;$('#heroBuild').onclick=$('#quickStart').onclick=$('#footerBuild').onclick=()=>$('#build').scrollIntoView({behavior:'smooth'});$('#heroSpaces').onclick=()=>$('#spaces').scrollIntoView({behavior:'smooth'});$('#quickType').onchange=e=>{mix.type=e.target.value;$('#mixType').value=mix.type;redraw()};$('#quickGuests').oninput=e=>{mix.guests=Number(e.target.value)||1;$('#mixGuests').value=mix.guests;redraw()};$('#quickDate').onchange=e=>{mix.date=e.target.value;$('#mixDate').value=mix.date};$('#mixType').onchange=e=>{mix.type=e.target.value;redraw()};$('#mixGuests').oninput=e=>{mix.guests=Math.max(1,Number(e.target.value)||1);redraw()};$('#mixSpace').onchange=e=>{mix.space=e.target.value;redraw()};$('#mixDate').onchange=e=>mix.date=e.target.value;$('#mixNotes').oninput=e=>mix.notes=e.target.value;$$('[data-space]').forEach(b=>b.onclick=()=>{mix.space=b.dataset.space;$('#mixSpace').value=mix.space;$('#build').scrollIntoView({behavior:'smooth'});redraw()});$$('[data-mix]').forEach(b=>b.onclick=()=>{const id=b.dataset.mix;mix.items=mix.items.includes(id)?mix.items.filter(x=>x!==id):mix.items.concat function head(t,s,a=''){return`<div class="pageHead"><div><div class="eyebrow">Kanteen control</div><h1>${esc(t)}</h1><div class="small muted">${esc(s)}</div></div><div class="row">${a}</div></div>`}function renderView(){const w=$('#work');if(state.view==='calendar')calendar(w);if(state.view==='events')events(w);if(state.view==='vendors')vendors(w);if(state.view==='library')library(w);if(state.view==='chat')chat(w);if(state.view==='ledger')ledger(w);if(state.view==='public')publicManager(w);if(state.view==='team')team(w);if(state.view==='system')system(w)}
function monthGrid(d){const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),a=[];for(let i=0;i<42;i++){const x=new Date(start);x.setDate(start.getDate()+i);a.push({date:iso(x),day:x.getDate(),other:x.getMonth()!==m})}return a}
function calendar(w){const days=monthGrid(state.cal),fmt=new Intl.DateTimeFormat('en-AU',{month:'long',year:'numeric'}),dayBlocks=db.blocks.filter(x=>x.date===state.selectedDate);w.innerHTML=head('Calendar','Venue availability is internal truth. Green available, yellow pending/hold, red booked or blocked.',`<button class="btn" id="prevM">←</button><span class="chip">${fmt.format(state.cal)}</span><button class="btn" id="nextM">→</button><button class="btn primary" id="newEvent">New event</button>`)+`<div class="calendarLayout"><section class="card pad"><div class="calGrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('')}${days.map(d=>{const bs=db.blocks.filter(x=>x.date===d.date),ss=bs.length?bs.slice(0,3).map(x=>x.status):['available','available','available'];while(ss.length<3)ss.push('available');return`<button class="day ${d.other?'other':''} ${d.date===iso()?'today':''}" data-day="${d.date}">${d.day}<div class="segments">${ss.map(s=>`<span class="seg ${s}"></span>`).join('')}</div></button>`}).join('')}</div></section><aside class="card pad"><div class="eyebrow">${state.selectedDate}</div><h2>Day view</h2><div class="list">${dayBlocks.length?dayBlocks.map(b=>`<div class="listRow"><div><h3>${esc(b.start)}–${esc(b.end)}</h3><p>${b.event?esc(db.events.find(x=>x.id===b.event)?.name||'Event'):esc(b.source||'Manual block')}</p></div>${status(b.status)}</div>`).join(''):`<div class="listRow"><div><h3>Available</h3><p>No active blocks.</p></div></div>`}</div><div class="stack" style="margin-top:10px"><button class="btn primary" id="buildHere">Build event here</button><button class="btn" id="blockHere">Block / hold time</button></div></aside></div>`;$('#prevM').onclick=()=>{state.cal=new Date(state.cal.getFullYear(),state.cal.getMonth()-1,1);adminPage()};$('#nextM').onclick=()=>{state.cal=new Date(state.cal.getFullYear(),state.cal.getMonth()+1,1);adminPage()};$$('[data-day]').forEach(b=>b.onclick=()=>{state.selectedDate=b.dataset.day;adminPage()});$('#newEvent').onclick=()=>newEvent(iso());$('#buildHere').onclick=()=>newEvent(state.selectedDate);$('#blockHere').onclick=()=>blockFlow(state.selectedDate)}
function newEvent(date){modal('Start an event',`<form id="newEventForm" class="stack"><input class="input" name="name" placeholder="Event name" required><div class="grid2"><select class="select" name="type">${['Celebration','Wedding','Birthday','Corporate','Community','Meeting','Private dining'].map(x=>`<option>${x}</option>`).join('')}</select><input class="input" name="guests" type="number" min="1" value="60"></div><div class="grid3"><input class="input" name="date" type="date" value="${date}"><input class="input" name="start" type="time" value="17:00"><input class="input" name="end" type="time" value="23:00"></div><input class="input" name="customer" placeholder="Customer name"><input class="input" name="email" type="email" placeholder="Customer email"><button class="btn primary">Create & build</button></form>`);$('#newEventForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),id=uid('e'),cid=uid('c');db.customers.push({id:cid,name:f.get('customer')||'New customer',email:f.get('email')||'',portal:'K-'+Math.floor(1000+Math.random()*9000)});db.events.push({id,name:f.get('name'),type:f.get('type'),date:f.get('date'),start:f.get('start'),end:f.get('end'),guests:Number(f.get('guests'))||1,status:'draft',customerId:cid,published:false,notes:''});state.selected=id;save();$('#modal').remove();state.view='events';adminPage();setTimeout(()=>builder(id),0)}}
function blockFlow(date){modal('Block / hold time',`<form id="blockForm" class="stack"><select class="select" name="status"><option value="blocked">Blocked</option><option value="pending">Pending / hold</option></select><div class="grid2"><input class="input" name="start" type="time" value="09:00"><input class="input" name="end" type="time" value="17:00"></div><input class="input" name="source" placeholder="Reason / source"><button class="btn primary">Add block</button></form>`);$('#blockForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);db.blocks.push({id:uid('b'),date,start:f.get('start'),end:f.get('end'),status:f.get('status'),event:null,source:f.get('source')||'Manual'});save();$('#modal').remove();adminPage()}}
function events(w){const active=db.events.filter(x=>!['completed','cancelled'].includes(x.status));w.innerHTML=head('Events','Every event is a living bundle of pieces, approvals, messages and ledger state.',`<button class="btn primary" id="newE2">New event</button>`)+`<div class="metricGrid"><div class="card metric"><div class="eyebrow">Active</div><div class="kpi">${active.length}</div></div><div class="card metric"><div class="eyebrow">Pending approvals</div><div class="kpi">${db.approvals.filter(x=>x.status==='pending').length}</div></div><div class="card metric"><div class="eyebrow">Published</div><div class="kpi">${db.events.filter(x=>x.published).length}</div></div><div class="card metric"><div class="eyebrow">Enquiries</div><div class="kpi">${db.enquiries.filter(x=>x.status==='new').length}</div></div></div><div class="list" style="margin-top:10px">${db.events.map(e=>{const t=totals(e.id),g=gate(e.id);return`<div class="listRow"><div><div class="row"><h3>${esc(e.name)}</h3>${status(e.status)}${e.published?'<span class="chip">public</span>':''}</div><p>${esc(e.date)} · ${e.guests} guests · ${money(t.quoted)} quote · ${g.ok?'ready':'needs '+g.reasons.length+' thing(s)'}</p></div><button class="btn" data-open="${e.id}">Build</button></div>`}).join('')}</div>${db.enquiries.length?`<div class="card pad" style="margin-top:12px"><div class="eyebrow">Incoming public plans</div><div class="list" style="margin-top:8px">${db.enquiries.map(q=>`<div class="listRow"><div><h3>${esc(q.name)} · ${esc(q.type)}</h3><p>${esc(q.date)} · ${q.guests} guests · ${money(q.estimate)} · ${esc(q.status)}</p></div><button class="btn" data-convert="${q.id}">Convert</button></div>`).join('')}</div></div>`:''}`;$('#newE2').onclick=()=>newEvent(iso());$$('[data-open]').forEach(b=>b.onclick=()=>builder(b.dataset.open));$$('[data-convert]').forEach(b=>b.onclick=()=>convertEnquiry(b.dataset.convert))}
function convertEnquiry(id){const q=db.enquiries.find(x=>x.id===id);if(!q)return;const cid=uid('c'),eid=uid('e');db.customers.push({id:cid,name:q.name,email:q.email,portal:q.portal});db.events.push({id:eid,name:`${q.name} — ${q.type}`,type:q.type,date:q.date,start:'17:00',end:'23:00',guests:q.guests,status:'draft',customerId:cid,published:false,notes:q.notes||''});const spMap={deck:'ld',garden:'lg',studio:'lst'};addLib(eid,spMap[q.space]||'ld');(q.items||[]).forEach(x=>addLib(eid,x));q.status='converted';q.event=eid;state.selected=eid;save();builder(eid)}
function addLib(eventId,libId){const e=db.events.find(x=>x.id===eventId),l=db.library.find(x=>x.id===libId);if(!e||!l)return;const qty=l.unit==='guest'?e.guests:1,id=uid('i');db.items.push({id,event:eventId,lib:l.id,name:l.name,cat:l.cat,qty,sell:l.sell,cost:l.cost,vendor:l.vendor});if(l.vendor){const as=uid('as');db.assignments.push({id:as,event:eventId,item:id,vendor:l.vendor,service:l.name,amount:l.cost*qty,status:'pending'});if(l.approval)db.approvals.push({id:uid('a'),event:eventId,item:id,vendor:l.vendor,status:'pending'})}e.status='awaiting_approval';save()}
function builder(id){state.selected=id;const e=db.events.find(x=>x.id===id),xs=db.items.filter(x=>x.event===id),t=totals(id),g=gate(id),w=$('#work');if(!e)return events(w);w.innerHTML=head('Event Builder','Place reusable pieces into the event. Vendor requests and ledger lines follow automatically.',`<button class="btn" id="backEvents">← Events</button><button class="btn ${g.ok?'good':''}" id="confirm">${g.ok?'Confirm event':'Check gates'}</button>`)+`<div class="builder"><aside class="card pad"><div class="eyebrow">Library</div><input class="input" id="libSearch" placeholder="Find a piece" style="margin:8px 0"><div class="libList">${db.library.map(l=>`<button class="lib" data-add="${l.id}"><b>${esc(l.name)}</b><span>${esc(l.cat)} · ${money(l.sell)}${l.unit==='guest'?'/guest':''}${l.vendor?' · vendor':''}</span></button>`).join('')}</div></aside><section class="eventCanvas"><div class="row between"><div><div class="eyebrow">${esc(e.type)} · ${esc(e.date)}</div><h2 style="font-size:30px;margin:5px 0">${esc(e.name)}</h2><div class="small muted">${e.guests} guests · ${esc(e.start)}–${esc(e.end)}</div></div>${status(e.status)}</div><div class="moneyGrid"><div class="moneyBox"><span>Customer quote</span><b>${money(t.quoted)}</b></div><div class="moneyBox"><span>Direct cost</span><b>${money(t.cost)}</b></div><div class="moneyBox"><span>Est. margin</span><b>${money(t.margin)}</b></div></div><div style="margin-top:12px">${xs.length?xs.map(x=>{const a=db.approvals.find(y=>y.item===x.id);return`<div class="piece"><div><b>${esc(x.name)} × ${x.qty}</b><span>${esc(x.cat||'Piece')}${x.vendor?' · '+esc(vendorName(x.vendor)):''}</span></div><div class="row">${a?status(a.status):''}<button class="btn ghost" data-remove="${x.id}">×</button></div></div>`}).join(''):`<div class="card pad"><b>Start adding pieces.</b><p class="small muted">Choose a space, food, entertainment, styling or equipment.</p></div>`}</div></section><aside class="card pad stack"><div class="eyebrow">Event controls</div><label class="small">Status<select class="select" id="eStatus">${['draft','hold','awaiting_approval','ready','confirmed','completed','cancelled'].map(x=>`<option ${e.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="small">Guests<input class="input" id="eGuests" type="number" min="1" value="${e.guests}"></label><label class="small">Notes<textarea class="textarea" id="eNotes">${esc(e.notes||'')}</textarea></label><div class="card pad"><div class="eyebrow">Confirmation gates</div><div class="small">${g.ok?'<b style="color:#a8ebc8">Ready to confirm</b>':g.reasons.map(x=>'• '+esc(x)).join('<br>')}</div></div><button class="btn" id="requests">Prepare vendor requests</button><button class="btn ${e.published?'good':''}" id="publish">${e.published?'Published publicly':'Publish public card'}</button><button class="btn" id="eventChat">Open event chat</button></aside></div>`;$('#backEvents').onclick=()=>adminPage();$('#libSearch').oninput=x=>{const q=x.target.value.toLowerCase();$$('[data-add]').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'block':'none')};$$('[data-add]').forEach(b=>b.onclick=()=>{addLib(id,b.dataset.add);builder(id)});$$('[data-remove]').forEach(b=>b.onclick=()=>{const iid=b.dataset.remove;db.items=db.items.filter(x=>x.id!==iid);db.approvals=db.approvals.filter(x=>x.item!==iid);db.assignments=db.assignments.filter(x=>x.item!==iid);save();builder(id)});$('#eStatus').onchange=x=>{e.status=x.target.value;save()};$('#eGuests').onchange=x=>{e.guests=Math.max(1,Number(x.target.value)||1);db.items.filter(i=>i.event===id&&db.library.find(l=>l.id===i.lib)?.unit==='guest').forEach(i=>i.qty=e.guests);save();builder(id)};$('#eNotes').onchange=x=>{e.notes=x.target.value;save()};$('#publish').onclick=()=>{e.published=!e.published;save();builder(id)};$('#confirm').onclick=()=>{const gg=gate(id);if(!gg.ok)return say(gg.reasons[0]);e.status='confirmed';let b=db.blocks.find(x=>x.event===id);if(b){b.status='booked';b.date=e.date;b.start=e.start;b.end=e.end}else db.blocks.push({id:uid('b'),date:e.date,start:e.start,end:e.end,status:'booked',event:id,source:'Kanteen'});save();say('Event confirmed');builder(id)};$('#requests').onclick=()=>{const ps=db.approvals.filter(x=>x.event===id&&x.status==='pending');for(const p of ps){const a=db.assignments.find(x=>x.item===p.item);if(a&&!db.messages.some(m=>m.thread===a.id))db.messages.push({id:uid('m'),thread:a.id,audience:'vendor',sender:'Kanteen',body:`Can you confirm ${e.name} — ${a.service}?`,at:new Date().toISOString()})}save();say(ps.length+' vendor request(s) prepared')};$('#eventChat').onclick=()=>{state.thread=id;state.view='chat';adminPage()}}
function vendors(w){w.innerHTML=head('Vendors','Validate applications, inspect availability and manage event-linked responses.',`<button class="btn" id="joinForm">Open signup form</button>`)+`${db.applications.length?`<div class="card pad"><div class="eyebrow">Needs validation</div><div class="list" style="margin-top:8px">${db.applications.map(a=>`<div class="listRow"><div><h3>${esc(a.business)}</h3><p>${esc(a.category)} · ${esc(a.email)}</p></div><div class="row"><button class="btn good" data-approve="${a.id}">Approve</button><button class="btn bad" data-decline="${a.id}">Decline</button></div></div>`).join('')}</div></div>`:''}<div class="metricGrid" style="margin-top:10px"><div class="card metric"><div class="eyebrow">Approved</div><div class="kpi">${db.vendors.filter(x=>x.status==='approved').length}</div></div><div class="card metric"><div class="eyebrow">Pending jobs</div><div class="kpi">${db.assignments.filter(x=>x.status==='pending').length}</div></div><div class="card metric"><div class="eyebrow">Accepted</div><div class="kpi">${db.assignments.filter(x=>x.status==='accepted').length}</div></div><div class="card metric"><div class="eyebrow">Declined</div><div class="kpi">${db.assignments.filter(x=>x.status==='declined').length}</div></div></div><div class="list" style="margin-top:10px">${db.vendors.map(v=>`<div class="listRow"><div><div class="row"><h3>${esc(v.business)}</h3>${status(v.status||'approved')}${v.verified?'<span class="chip">verified</span>':''}</div><p>${esc(v.category)} · availability ${esc(v.available||'unknown')}</p></div><button class="btn" data-vportal="${v.id}">Open portal</button></div>`).join('')}</div>`;$('#joinForm').onclick=vendorSignup;$$('[data-approve]').forEach(b=>b.onclick=()=>{const a=db.applications.find(x=>x.id===b.dataset.approve),v={id:uid('v'),business:a.business,category:a.category,verified:true,status:'approved',email:a.email,pin:String(Math.floor(100000+Math.random()*900000)),available:'available',desc:a.desc};db.vendors.push(v);a.status='approved';db.applications=db.applications.filter(x=>x.id!==a.id);save();say('Vendor approved · PIN '+v.pin);adminPage()});$$('[data-decline]').forEach(b=>b.onclick=()=>{db.applications=db.applications.filter(x=>x.id!==b.dataset.decline);save();adminPage()});$$('[data-vportal]').forEach(b=>b.onclick=()=>{state.vendor=b.dataset.vportal;state.surface='vendor';render()})}
function library(w){w.innerHTML=head('Library','Reusable pieces become event snapshots when placed into an event.',`<button class="btn primary" id="newLib">Add piece</button>`)+`<div class="cards">${db.library.map(l=>`<div class="card pad"><div class="row between"><div><div class="eyebrow">${esc(l.cat)}</div><h3>${esc(l.name)}</h3></div>${l.public?'<span class="chip">public</span>':''}</div><p class="small muted">${esc(l.desc||'')}</p><div class="row between"><b>${money(l.sell)}${l.unit==='guest'?'/guest':''}</b><span class="tiny muted">cost ${money(l.cost)}</span></div>${l.vendor?`<div class="tiny muted" style="margin-top:7px">${esc(vendorName(l.vendor))}${l.approval?' · approval required':''}</div>`:''}</div>`).join('')}</div>`;$('#newLib').onclick=()=>modal('Add library piece',`<form id="libForm" class="stack"><input class="input" name="name" placeholder="Piece name" required><select class="select" name="cat">${['Space','Catering','Entertainment','Styling','Equipment','Staff','Custom'].map(x=>`<option>${x}</option>`).join('')}</select><div class="grid2"><input class="input" name="sell" type="number" placeholder="Customer sell"><input class="input" name="cost" type="number" placeholder="Internal cost"></div><select class="select" name="unit"><option>event</option><option>guest</option><option>hour</option><option>item</option></select><select class="select" name="vendor"><option value="">No vendor</option>${db.vendors.map(v=>`<option value="${v.id}">${esc(v.business)}</option>`).join('')}</select><label class="small"><input type="checkbox" name="approval"> Requires vendor approval</label><label class="small"><input type="checkbox" name="public"> Publicly visible</label><textarea class="textarea" name="desc" placeholder="Description"></textarea><button class="btn primary">Add piece</button></form>`);setTimeout(()=>{$('#libForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);db.library.push({id:uid('l'),name:f.get('name'),cat:f.get('cat'),sell:Number(f.get('sell'))||0,cost:Number(f.get('cost'))||0,unit:f.get('unit'),vendor:f.get('vendor')||null,approval:!!f.get('approval'),public:!!f.get('public'),desc:f.get('desc')});save();$('#modal').remove();adminPage()}},0)}
function threads(){return[{id:'team',label:'Team room'}].concat(db.events.map(e=>({id:e.id,label:e.name}))).concat(db.assignments.map(a=>({id:a.id,label:vendorName(a.vendor)+' · '+a.service})))}function chat(w){const ts=threads(),active=state.thread||'team';state.thread=active;const msgs=db.messages.filter(x=>x.thread===active),label=ts.find(x=>x.id===active)?.label||'Thread';w.innerHTML=head('Chat','Team, customer and vendor conversations stay attached to the work they concern.')+`<div class="chatLayout"><aside class="card pad"><div class="eyebrow">Threads</div><div class="threadList" style="margin-top:8px">${ts.map(t=>`<button class="threadBtn ${t.id===active?'active':''}" data-thread="${t.id}">${esc(t.label)}</button>`).join('')}</div></aside><section class="card pad"><div class="eyebrow">Conversation</div><h2 style="margin:5px 0">${esc(label)}</h2><div class="messages">${msgs.map(m=>`<div class="bubble ${m.sender===db.user?.name?'me':''}"><span class="who">${esc(m.sender)}</span>${esc(m.body)}</div>`).join('')||'<div class="small muted">No messages yet.</div>'}</div><form id="sendMsg" class="row" style="margin-top:10px"><input class="input" style="flex:1" name="body" placeholder="Write a message…" required><button class="btn primary">Send</button></form></section></div>`;$$('[data-thread]').forEach(b=>b.onclick=()=>{state.thread=b.dataset.thread;adminPage()});$('#sendMsg').onsubmit=e=>{e.preventDefault();db.messages.push({id:uid('m'),thread:active,audience:'linked',sender:db.user?.name||'Admin',body:new FormData(e.currentTarget).get('body'),at:new Date().toISOString()});save();adminPage()}}
function ledger(w){let quoted=0,cost=0;const rows=[];for(const e of db.events){const t=totals(e.id);quoted+=t.quoted;cost+=t.cost;rows.push([e.name,'Quoted revenue','—',t.quoted,e.status]);for(const a of db.assignments.filter(x=>x.event===e.id))rows.push([e.name,'Vendor payable',vendorName(a.vendor),-a.amount,a.status])}w.innerHTML=head('Ledger','Operational truth only: quotes, direct costs, vendor obligations and estimated margin. No funds move here.')+`<div class="metricGrid"><div class="card metric"><div class="eyebrow">Quoted</div><div class="kpi">${money(quoted)}</div></div><div class="card metric"><div class="eyebrow">Direct costs</div><div class="kpi">${money(cost)}</div></div><div class="card metric"><div class="eyebrow">Est. margin</div><div class="kpi">${money(quoted-cost)}</div></div><div class="card metric"><div class="eyebrow">Open vendor lines</div><div class="kpi">${db.assignments.filter(x=>x.status!=='paid').length}</div></div></div><div class="card pad tableWrap" style="margin-top:10px"><table class="table"><thead><tr><th>Event</th><th>Type</th><th>Vendor</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${money(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('')}</tbody></table></div>`}
function publicManager(w){w.innerHTML=head('Public site','The public page is a projection of approved content, never private bookings.')+`<div class="grid2"><div class="card pad stack"><label class="small">Hero<input class="input" id="heroText" value="${esc(db.venue.hero)}"></label><label class="small">Tagline<textarea class="textarea" id="tagText">${esc(db.venue.tagline)}</textarea></label><button class="btn primary" id="savePublic">Save copy</button></div><div class="card pad"><div class="eyebrow">Projection status</div><div class="kpi">${db.events.filter(x=>x.published&&x.status==='confirmed').length}</div><div class="small muted">confirmed published events</div><div class="kpi" style="margin-top:10px">${db.library.filter(x=>x.public).length}</div><div class="small muted">public library pieces</div><button class="btn" id="openPublic" style="margin-top:12px">Open public site</button></div></div>`;$('#savePublic').onclick=()=>{db.venue.hero=$('#heroText').value;db.venue.tagline=$('#tagText').value;save();say('Public copy saved')};$('#openPublic').onclick=()=>{state.surface='public';render()}}
function team(w){w.innerHTML=head('Team & access','Sandbox identities demonstrate multi-role workflow; shared live access needs a real backend.')+`<div class="cards">${db.team.map(t=>`<div class="card pad"><div class="eyebrow">${esc(t.role)}</div><h3>${esc(t.name)}</h3><button class="btn" data-team="${t.id}">Work as ${esc(t.name)}</button></div>`).join('')}</div>`;$$('[data-team]').forEach(b=>b.onclick=()=>{const t=db.team.find(x=>x.id===b.dataset.team);db.user={name:t.name,role:t.role};save();adminPage()})}
function system(w){w.innerHTML=head('System & Core Lens','One HTML file, browser storage and a visible NOR state fabric.')+`<div class="metricGrid"><div class="card metric"><div class="eyebrow">NOR state</div><div class="kpi">${fabric.n} bits</div><div class="small muted">${fabric.g.length} gates</div></div><div class="card metric"><div class="eyebrow">Transitions</div><div class="kpi">${fabric.transitions.toLocaleString()}</div></div><div class="card metric"><div class="eyebrow">Errors</div><div class="kpi">${state.errors.length}</div></div><div class="card metric"><div class="eyebrow">Storage</div><div class="kpi">LOCAL</div><div class="small muted">this browser</div></div></div><div class="grid2" style="margin-top:10px"><div class="card pad"><div class="eyebrow">Production path</div><p class="small muted">This one-file build is publishable as a static page. To make staff/vendor/customer data shared across devices, connect the same domain actions to the existing Supabase tables and authentication.</p><button class="btn primary" id="openCore2">Open Core Lens</button></div><div class="card pad"><div class="eyebrow">Safety boundary</div><p class="small muted">The internal Operator can perform bounded Kanteen actions. It does not execute arbitrary code or rewrite itself.</p><button class="btn bad" id="reset">Reset sandbox</button></div></div>`;$('#openCore2').onclick=openCore;$('#reset').onclick=()=>{if(confirm('Reset all local Kanteen data?')){localStorage.removeItem(STORE);db=defaults();state.selected=db.selected;save();adminPage()}}}
function vendorPage(){const v=db.vendors.find(x=>x.id===state.vendor),jobs=db.assignments.filter(x=>x.vendor===v?.id);app.innerHTML=`<div class="portal"><div class="top"><div class="brand"><div class="mark"></div><div><b>KANTEEN VENDOR</b><span>${esc(v?.business||'Vendor')}</span></div></div><button class="btn" id="vExit">Exit</button></div><main class="wrap"><div class="portalHero"><div class="eyebrow">Vendor workspace</div><h1>${esc(v?.business||'Vendor')}</h1><p class="muted">Confirm work, update availability and keep event questions attached to the assignment.</p></div><div class="grid2"><section class="card pad"><div class="eyebrow">Job requests</div><div class="list" style="margin-top:8px">${jobs.length?jobs.map(j=>`<div class="listRow"><div><h3>${esc(db.events.find(x=>x.id===j.event)?.name||'Event')}</h3><p>${esc(j.service)} · ${money(j.amount)} vendor ledger</p></div><div class="row">${status(j.status)}<button class="btn good" data-job="${j.id}" data-act="accepted">Accept</button><button class="btn bad" data-job="${j.id}" data-act="declined">Decline</button></div></div>`).join(''):'<div class="small muted">No job requests.</div>'}</div></section><section class="card pad stack"><div class="eyebrow">Profile</div><label class="small">Availability<select class="select" id="vAvail"><option ${v?.available==='available'?'selected':''}>available</option><option ${v?.available==='limited'?'selected':''}>limited</option><option ${v?.available==='unavailable'?'selected':''}>unavailable</option></select></label><textarea class="textarea" id="vDesc">${esc(v?.desc||'')}</textarea><button class="btn primary" id="vSave">Save profile</button></section></div></main></div>`;$('#vExit').onclick=()=>{state.surface='public';render()};$('#vSave').onclick=()=>{v.available=$('#vAvail').value;v.desc=$('#vDesc').value;save();say('Vendor profile saved')};$$('[data-job]').forEach(b=>b.onclick=()=>{const j=db.assignments.find(x=>x.id===b.dataset.job),a=db.approvals.find(x=>x.item===j.item);j.status=b.dataset.act;if(a)a.status=b.dataset.act==='accepted'?'yes':'no';save();vendorPage()})}
function customerPage(){let q=null,c=null,e=null,thread=null;if(state.customer?.type==='q'){q=db.enquiries.find(x=>x.id===state.customer.id);thread=q?.event||q?.portal;if(q?.event)e=db.events.find(x=>x.id===q.event)}else{c=db.customers.find(x=>x.id===state.customer?.id);e=db.events.find(x=>x.customerId===c?.id);thread=e?.id}const title=e?.name||`${q?.type||'Your'} plan`,msgs=db.messages.filter(x=>x.thread===thread),estimate=e?totals(e.id).quoted:q?.estimate||0,stat=e?.status||q?.status||'new';app.innerHTML=`<div class="portal"><div class="top"><div class="brand"><div class="mark"></div><div><b>KANTEEN</b><span>My event</span></div></div><button class="btn" id="cExit">Exit</button></div><main class="wrap"><div class="portalHero"><div class="eyebrow">Your Kanteen plan</div><h1>${esc(title)}</h1><div class="row">${status(stat)}<span class="chip">${money(estimate)} working total</span></div></div><div class="grid2"><section class="card pad"><div class="eyebrow">Plan</div>${e?`<h2>${esc(e.date)} · ${e.guests} guests</h2><p class="small muted">${esc(e.notes||'')}</p>${db.items.filter(x=>x.event===e.id).map(i=>`<div class="piece"><b>${esc(i.name)} × ${i.qty}</b><b>${money(i.sell*i.qty)}</b></div>`).join('')}`:`<h2>${esc(q?.date||'')}</h2><div class="row"><span class="chip">${q?.guests||0} guests</span></div><p class="small muted">${esc(q?.notes||'Kanteen has received this enquiry.')}</p>`}</section><section class="card pad"><div class="eyebrow">Conversation</div><div class="messages" style="margin-top:8px">${msgs.map(m=>`<div class="bubble ${m.sender!=='Kanteen'?'me':''}"><span class="who">${esc(m.sender)}</span>${esc(m.body)}</div>`).join('')}</div><form id="cSend" class="row" style="margin-top:10px"><input class="input" name="body" placeholder="Message Kanteen…" required><button class="btn primary">Send</button></form></section></div></main></div>`;$('#cExit').onclick=()=>{state.surface='public';render()};$('#cSend').onsubmit=x=>{x.preventDefault();db.messages.push({id:uid('m'),thread,audience:'customer',sender:q?.name||c?.name||'Customer',body:new FormData(x.currentTarget).get('body'),at:new Date().toISOString()});save();customerPage()}}
function aiHTML(){return`<div class="aiPanel"><div class="top"><b>Kanteen Operator</b><button class="btn" id="closeAI">×</button></div><div class="aiMsgs">${state.aiMsgs.map(m=>`<div class="aiMsg ${m.from==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div><form id="aiForm" class="row" style="padding:10px;border-top:1px solid var(--line)"><input class="input" name="q" placeholder="e.g. add DJ, show approvals"><button class="btn primary">Send</button></form></div>`}function wireAI(){if(!state.ai)return;$('#closeAI').onclick=()=>{state.ai=false;adminPage()};$('#aiForm').onsubmit=e=>{e.preventDefault();const q=String(new FormData(e.currentTarget).get('q')||'').trim();if(!q)return;state.aiMsgs.push({from:'user',text:q});state.aiMsgs.push({from:'ai',text:operator(q)});adminPage()}}
function operator(q){const t=q.toLowerCase(),e=db.events.find(x=>x.id===state.selected);if(t.includes('calendar')){state.view='calendar';return'Opened the calendar.'}if(t.includes('approval')){state.view='vendors';return`${db.approvals.filter(x=>x.status==='pending').length} vendor approval(s) are pending.`}if(t.includes('ledger')||t.includes('money')||t.includes('margin')){state.view='ledger';return'Opened the operational ledger.'}if(t.includes('chat')||t.includes('message')){state.view='chat';return'Opened communications.'}if(t.includes('add dj')&&e){if(!db.items.some(x=>x.event===e.id&&x.lib==='ldj'))addLib(e.id,'ldj');return'Added DJ + dance-floor sound and created the vendor approval gate.'}if(t.includes('add catering')&&e){addLib(e.id,'lf');return'Added seasonal grazing using the current guest count and created the catering approval gate.'}if(t.includes('publish')&&e){e.published=true;save();return`Published ${e.name} to the public projection.`}if((t.includes('build')||t.includes('create'))&&(t.includes('birthday')||t.includes('event'))){const guests=Number(t.match(/(\d{2,3})\s*(guest|people)/)?.[1]||60),id=uid('e');db.events.push({id,name:'Operator draft — Birthday',type:'Birthday',date:addDays(iso(),28),start:'17:00',end:'23:00',guests,status:'draft',customerId:null,published:false,notes:''});state.selected=id;addLib(id,guests>80?'ld':'lg');addLib(id,'lf');save();state.view='events';return`Built a ${guests}-guest birthday draft with a suitable space and catering.`}return e?`${e.name}: ${money(totals(e.id).quoted)} quote, ${money(totals(e.id).margin)} estimated margin. ${gate(e.id).ok?'Ready to confirm.':gate(e.id).reasons.join('; ')}`:'Try “build a birthday for 70”, “add DJ”, “show approvals”, or “open ledger”.'}
function report(){const e=db.events.find(x=>x.id===state.selected),t=e?totals(e.id):null,g=e?gate(e.id):null;return['KANTEEN NOR v3 CORE REPORT','time: '+new Date().toISOString(),'device: '+navigator.userAgent,'surface: '+state.surface,'view: '+state.view,`entities: events=${db.events.length} vendors=${db.vendors.length} applications=${db.applications.length} enquiries=${db.enquiries.length} approvals=${db.approvals.length} assignments=${db.assignments.length} messages=${db.messages.length} blocks=${db.blocks.length}`,`selected: ${e?e.name+' quote='+t.quoted+' cost='+t.cost+' margin='+t.margin+' gate='+(g.ok?'ready':g.reasons.join('|')):'none'}`,`nor: bits=${fabric.n} gates=${fabric.g.length} transitions=${fabric.transitions}`,`errors: ${state.errors.length?state.errors.join(' | '):'none'}`,'recent trace:',...db.traces.slice(-12).map(x=>x.at+' · '+x.a+' · '+x.o)].join('\n')}
function openCore(){const r=report();modal('Kanteen Core Lens',`<div class="grid3"><div class="card pad"><div class="eyebrow">NOR gates</div><div class="kpi">${fabric.g.length}</div></div><div class="card pad"><div class="eyebrow">Transitions</div><div class="kpi">${fabric.transitions.toLocaleString()}</div></div><div class="card pad"><div class="eyebrow">Errors</div><div class="kpi">${state.errors.length}</div></div></div><textarea id="report" class="report" readonly>${esc(r)}</textarea><div class="row"><button class="btn primary" id="copyReport">Copy Report</button><button class="btn" id="exportJson">Export JSON</button></div>`);$('#copyReport').onclick=async()=>{try{await navigator.clipboard.writeText(r);say('Report copied')}catch{$('#report').select()}};$('#exportJson').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kanteen-nor-v3-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}}
let heroAnim=0;function animateHero(){cancelAnimationFrame(heroAnim);const c=$('#heroCanvas');if(!c)return;const ctx=c.getContext('2d'),pts=Array.from({length:78},()=>({x:Math.random(),y:Math.random(),p:Math.random()*6.28,z:Math.random()}));const draw=t=>{if(!document.body.contains(c))return;const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.4),W=Math.floor(r.width*d),H=Math.floor(r.height*d);if(c.width!==W||c.height!==H){c.width=W;c.height=H}ctx.clearRect(0,0,W,H);for(let i=0;i<pts.length;i++){const p=pts[i],x=p.x*W+Math.sin(t*.0002+p.p)*30*d,y=p.y*H+Math.cos(t*.00014+p.p)*22*d;ctx.fillStyle=`rgba(190,225,255,${.07+p.z*.2})`;ctx.beginPath();ctx.arc(x,y,(1+p.z*2.2)*d,0,Math.PI*2);ctx.fill();if(i%6===0){const q=pts[(i+9)%pts.length];ctx.strokeStyle='rgba(157,216,255,.035)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(q.x*W,q.y*H);ctx.stroke()}}heroAnim=requestAnimationFrame(draw)};heroAnim=requestAnimationFrame(draw)}
render();})();
