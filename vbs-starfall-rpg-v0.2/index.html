<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040711"><title>Loading VBS STARFALL v0.2…</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#040711;color:#eaf8ff;font-family:system-ui}main{text-align:center;padding:24px}b{font-size:24px}p{color:#91a6bc}#e{color:#ff9b9b}</style><main><b>VBS STARFALL v0.2</b><p>Loading evolved game core…</p><p id="e"></p></main><script>(async()=>{try{const names=['p1.txt','p2.txt','p3a.txt','p3b.txt','p4.txt'];const parts=await Promise.all(names.map(n=>fetch(n+'?v=2').then(r=>{if(!r.ok)throw Error(n+' '+r.status);return r.text()})));const b64=parts.join('').trim();const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('This browser does not support the game decompressor.');const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(err){document.getElementById('e').textContent='Load error: '+err.message}})();</script>
